name: Weekly external link check
on:
  workflow_dispatch:
  schedule:
    - cron: '43 3 * * 2'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check published links and write the run summary
        run: python3 scripts/check_external_links.py
