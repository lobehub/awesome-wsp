name: Star history
on:
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * 1'

permissions:
  contents: read

jobs:
  record:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency: record-star-history
    permissions:
      contents: write
    env:
      BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Record and verify the current count
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          stars=$(gh api "repos/$GITHUB_REPOSITORY" --jq .stargazers_count)
          python3 scripts/star_history.py --record "$stars"
          python3 scripts/star_history.py --check
      - name: Save any new observation
        run: |
          git add assets/star-history.csv assets/star-history.svg
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "Record weekly GitHub star count"
          git pull --rebase origin "$BRANCH"
          git push origin "HEAD:$BRANCH"
